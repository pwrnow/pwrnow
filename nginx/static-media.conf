server {
    listen 80;
    server_name _;

    # CORS headers for cross-origin requests
    add_header Access-Control-Allow-Origin "https://api.pwrnow.pl";
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";

    # Serve static files collected by Django at /static/
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Override CORS for static files
        add_header Access-Control-Allow-Origin "https://api.pwrnow.pl";
    }

    # Serve media files uploaded by users at /media/
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public";
        
        # Override CORS for media files  
        add_header Access-Control-Allow-Origin "https://api.pwrnow.pl";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Default fallback - return 404 for anything else
    location / {
        return 404;
    }
}
