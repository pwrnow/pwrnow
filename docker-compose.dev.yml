volumes:
    postgres_data: {}
    django_media: {}
    django_static: {}
    redis_data: {}

services:
    postgres:
        image: postgres:17
        container_name: pwrnow_postgres
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7
        container_name: pwrnow_redis
        volumes:
            - redis_data:/data

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_backend
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - REDIS_URL=redis://redis:6379/0
        volumes:
            - django_media:/app/media
            - django_static:/app/staticfiles
        depends_on:
            - redis
            - postgres

    celeryworker:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_celeryworker
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - REDIS_URL=redis://redis:6379/0
        depends_on:
            - redis
            - postgres
        command: celery -A config.celery_app worker -l INFO

    celerybeat:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_celerybeat
        env_file:
            - .env
        environment:
            - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
            - REDIS_URL=redis://redis:6379/0
        command: celery -A config.celery_app beat -l INFO
        depends_on:
            - redis
            - postgres

    web:
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: pwrnow_web
        environment:
            - NODE_ENV=production
            - PORT=3000
            - HOSTNAME=0.0.0.0

    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: pwrnow_nginx
        ports:
            - "80:80"
        depends_on:
            - backend
            - web
        volumes:
            - django_static:/usr/share/nginx/html/static
