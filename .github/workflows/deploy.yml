name: Deploy

on:
  push:
    branches: ['main']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the repo changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            web:
              - 'web/**'
            nginx:
              - 'nginx/**'

  # Backend image — shared by backend, worker, beat, flower
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ vars.REGISTRY_URL }}/pwrnow/backend:latest
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

  # Frontend (Next.js)
  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ vars.REGISTRY_URL }}/pwrnow/web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,scope=web-prod,mode=max

  # Nginx
  build-nginx:
    needs: changes
    if: needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      - uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ vars.REGISTRY_URL }}/pwrnow/nginx:latest
          cache-from: type=gha,scope=nginx-prod
          cache-to: type=gha,scope=nginx-prod,mode=max

  # Trigger Coolify redeployments for whichever services were rebuilt
  deploy:
    needs: [build-backend, build-web, build-nginx]
    # Run if at least one build succeeded and none failed
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        needs.build-backend.result == 'success' ||
        needs.build-web.result    == 'success' ||
        needs.build-nginx.result  == 'success'
      )
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy backend + worker + beat + flower
        if: needs.build-backend.result == 'success'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
        run: |
          for entry in \
            "backend:${{ secrets.COOLIFY_BACKEND_UUID }}" \
            "worker:${{ secrets.COOLIFY_WORKER_UUID }}" \
            "beat:${{ secrets.COOLIFY_BEAT_UUID }}" \
            "flower:${{ secrets.COOLIFY_FLOWER_UUID }}"; do
            name="${entry%%:*}"
            uuid="${entry##*:}"
            echo "Deploying $name ($uuid)..."
            resp=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Content-Type: application/json" \
              "$COOLIFY_URL/api/v1/deploy?uuid=$uuid&force=false")
            echo "$name: HTTP $resp"
            [ "$resp" = "200" ] || [ "$resp" = "201" ] || { echo "Deploy failed for $name"; exit 1; }
          done

      - name: Deploy frontend
        if: needs.build-web.result == 'success'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
        run: |
          resp=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            "$COOLIFY_URL/api/v1/deploy?uuid=${{ secrets.COOLIFY_FRONTEND_UUID }}&force=false")
          echo "frontend: HTTP $resp"
          [ "$resp" = "200" ] || [ "$resp" = "201" ] || { echo "Deploy failed for frontend"; exit 1; }

      - name: Deploy nginx
        if: needs.build-nginx.result == 'success'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
        run: |
          resp=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            "$COOLIFY_URL/api/v1/deploy?uuid=${{ secrets.COOLIFY_NGINX_UUID }}&force=false")
          echo "nginx: HTTP $resp"
          [ "$resp" = "200" ] || [ "$resp" = "201" ] || { echo "Deploy failed for nginx"; exit 1; }
