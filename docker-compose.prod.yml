volumes:
    django_media: {}
    django_static: {}
    redis_data: {}

networks:
    default:
        external: true
        name: coolify

services:
    redis:
        image: redis:7
        container_name: pwrnow_redis
        volumes:
            - redis_data:/data

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_backend
        external_links:
            - pwrnow_db:pwrnow_db
        volumes:
            - django_media:/app/media
        environment:
            - SECRET_KEY=${SECRET_KEY}
            - DEBUG=${DEBUG:-False}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
            - SITE_URL=${SITE_URL}
            - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
        depends_on:
            - redis
        command: ["/start.sh"]

    celeryworker:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_celeryworker
        external_links:
            - pwrnow_db:pwrnow_db
        command: celery -A config.celery_app worker -l INFO
        depends_on:
            - redis

    celerybeat:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_celerybeat
        external_links:
            - pwrnow_db:pwrnow_db
        command: celery -A config.celery_app beat -l INFO
        depends_on:
            - redis

    web:
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: pwrnow_web
        environment:
            - NODE_ENV=production
            - PORT=3000
            - HOSTNAME=0.0.0.0

    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: pwrnow_nginx
        ports:
            - "8001:80"
        depends_on:
            - backend
            - web
        volumes:
            - django_static:/usr/share/nginx/html/static
