volumes:
    postgres_data: {}
    django_media: {}
    django_static: {}
    redis_data: {}

services:
    postgres:
        image: postgres:17
        container_name: pwrnow_postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    redis:
        image: redis:7
        container_name: pwrnow_redis
        volumes:
            - redis_data:/data

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_backend
        ports:
            - "8001:5000"
        volumes:
            - django_media:/app/media
        environment:
            - SECRET_KEY=${SECRET_KEY}
            - DEBUG=${DEBUG:-False}
            - ALLOWED_HOSTS=${ALLOWED_HOSTS}
            - DATABASE_URL=${DATABASE_URL}
            - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
            - SITE_URL=${SITE_URL}
            - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        depends_on:
            - redis
            - postgres
        command: ["/start.sh"]

    celeryworker:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_celeryworker
        volumes:
            - ./backend:/app
        command: celery -A config.celery_app worker -l INFO
        depends_on:
            - redis
            - postgres

    celerybeat:
        build:
            context: ./backend
            dockerfile: Dockerfile.prod
        container_name: pwrnow_celerybeat
        command: celery -A config.celery_app beat -l INFO
        depends_on:
            - redis
            - postgres

    web:
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: pwrnow_web
        environment:
            - NODE_ENV=production
            - PORT=3000
            - HOSTNAME=0.0.0.0

    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: pwrnow_nginx
        ports:
            - "80:80"
        depends_on:
            - backend
            - web
        volumes:
            - django_static:/usr/share/nginx/html/static
