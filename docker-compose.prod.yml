volumes:
  postgres_data: {}
  django_media: {}
  redis_data: {}

services:
  postgres:
    image: postgres:17
    container_name: pwrnow_postgres
    environment:
      POSTGRES_DB: pwrnow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: pwrnow_redis
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pwrnow_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pwrnow
      - REDIS_URL=redis://redis:6379/0
    ports:
      - '8001:5000'
    volumes:
      - django_media:/app/media
    depends_on:
      - redis
      - postgres
    command: ['/start.sh']

  celeryworker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pwrnow_celeryworker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pwrnow
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: celery -A config.celery_app worker -l INFO
    depends_on:
      - redis
      - postgres

  celerybeat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: pwrnow_celerybeat
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pwrnow
      - REDIS_URL=redis://redis:6379/0
    command: celery -A config.celery_app beat -l INFO
    depends_on:
      - redis
      - postgres

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pwrnow_nginx
    ports:
      - '80:80'
    depends_on:
      - backend
    volumes:
      - django_media:/usr/share/nginx/media:ro
