version: "3.8"

services:
    plausible_db:
        image: postgres:15
        restart: unless-stopped
        environment:
            POSTGRES_DB: plausible
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - plausible_db_data:/var/lib/postgresql/data
        ports:
            - "5433:5432"

    plausible_events_db:
        image: clickhouse/clickhouse-server:23.3.7.5-alpine
        restart: unless-stopped
        volumes:
            - plausible_event_data:/var/lib/clickhouse
            - ./plausible/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
            - ./plausible/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        ports:
            - "8123:8123"

    plausible:
        image: plausible/analytics:v2.0
        restart: unless-stopped
        command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
        depends_on:
            - plausible_db
            - plausible_events_db
        ports:
            - "8001:8000"
        environment:
            BASE_URL: http://localhost:8001
            SECRET_KEY_BASE: "InVTIronGSsI5ByEFQ0K1X6jvGYykB7qNFaX5TuRETLjpz1z3ZXn0rW6tMKkEqhM"
            DATABASE_URL: postgres://postgres:postgres@plausible_db:5432/plausible
            CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible_events_db
            DISABLE_REGISTRATION: "true"

volumes:
    plausible_db_data:
    plausible_event_data:
