version: '3.8'

services:
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    environment:
      # Discord webhook URL for notifications
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      # Mount the start script
      - ./start.sh:/start.sh:ro
      # Mount the configuration template
      - ./alertmanager.yml.template:/tmp/alertmanager.yml.template:ro
      # Persistent storage for alertmanager data
      - alertmanager_data:/alertmanager
    entrypoint: ["/start.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  alertmanager_data:
    driver: local
