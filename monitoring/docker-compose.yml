version: "3.8"

services:
    prometheus:
        build: ./prometheus # Use your Dockerfile
        container_name: prometheus
        volumes:
            - prometheus_data:/prometheus
        healthcheck:
            test:
                - CMD
                - wget
                - "--no-verbose"
                - "--tries=1"
                - "--spider"
                - "http://localhost:9090/-/healthy"
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 5s
        restart: unless-stopped
        networks:
            - monitoring
        depends_on:
            - alertmanager

    alertmanager:
        build: ./alertmanager # Use your Dockerfile
        container_name: alertmanager
        environment:
            - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
        volumes:
            - alertmanager_data:/alertmanager
        restart: unless-stopped
        networks:
            - monitoring

    grafana:
        build: ./grafana # Use your Dockerfile
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${SERVICE_PASSWORD_GRAFANA}
            - GF_DATABASE_TYPE=postgres
            - GF_DATABASE_HOST=postgresql
            - GF_DATABASE_USER=${SERVICE_USER_POSTGRES}
            - GF_DATABASE_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
            - GF_DATABASE_NAME=${POSTGRES_DB}
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - "grafana-data:/var/lib/grafana"
        healthcheck:
            test:
                - CMD
                - curl
                - "-f"
                - "http://127.0.0.1:3000/api/health"
            interval: 5s
            timeout: 20s
            retries: 10
        depends_on:
            - postgresql
            - prometheus
        restart: unless-stopped
        networks:
            - monitoring

    postgresql:
        image: "postgres:16-alpine"
        volumes:
            - "postgresql-data-v2:/var/lib/postgresql/data"
        environment:
            - POSTGRES_USER=${SERVICE_USER_POSTGRES}
            - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
            - POSTGRES_DB=${POSTGRES_DB}
        healthcheck:
            test:
                - CMD-SHELL
                - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
            interval: 5s
            timeout: 20s
            retries: 10
        restart: unless-stopped
        networks:
            - monitoring

    node-exporter:
        build: ./node-exporter # Use your Dockerfile
        container_name: node-exporter
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        restart: unless-stopped
        networks:
            - monitoring

    cadvisor:
        build: ./cadvisor # Use your Dockerfile
        container_name: cadvisor
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:rw
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        privileged: true
        devices:
            - /dev/kmsg
        restart: unless-stopped
        networks:
            - monitoring

volumes:
    prometheus_data:
    alertmanager_data:
    grafana-data:
    postgresql-data-v2:

networks:
    monitoring:
        driver: bridge
