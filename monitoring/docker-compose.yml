version: "3.8"

services:
    prometheus:
        build:
            context: ./prometheus
            dockerfile: Dockerfile
        image: pwrnow/prometheus:latest
        container_name: prometheus
        ports:
            - "9090:9090"
        # Needed so Prometheus can scrape Docker Engine metrics at host.docker.internal:9323
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - prometheus-data:/prometheus
        depends_on:
            - alertmanager
            - node-exporter
            - cadvisor
        restart: unless-stopped

    alertmanager:
        build:
            context: ./alertmanager
            dockerfile: Dockerfile
        image: pwrnow/alertmanager:latest
        container_name: alertmanager
        environment:
            - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
        ports:
            - "9093:9093"
        volumes:
            - alertmanager-data:/alertmanager
        restart: unless-stopped

    node-exporter:
        image: prom/node-exporter:latest
        container_name: node-exporter
        pid: host
        command:
            - "--path.rootfs=/host"
            - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)"
        volumes:
            - "/:/host:ro,rslave"
        ports:
            - "9100:9100"
        restart: unless-stopped

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: cadvisor
        privileged: true
        devices:
            - /dev/kmsg:/dev/kmsg
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:rw
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        ports:
            - "8080:8080"
        restart: unless-stopped

volumes:
    prometheus-data:
    alertmanager-data:
