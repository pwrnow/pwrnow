groups:
    - name: pwrnow.rules
      rules:
          # High CPU usage
          - alert: HighCpuUsage
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 2m
            labels:
                severity: warning
            annotations:
                summary: "High CPU usage detected"
                description: "CPU usage is above 80% for instance {{ $labels.instance }}"

          # High memory usage
          - alert: HighMemoryUsage
            expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "High memory usage detected"
                description: "Memory usage is above 85% for instance {{ $labels.instance }}"

          # Low disk space
          - alert: LowDiskSpace
            expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
            for: 5m
            labels:
                severity: critical
            annotations:
                summary: "Low disk space"
                description: "Disk space is below 10% for instance {{ $labels.instance }}"

          # Container down
          - alert: ContainerDown
            expr: up == 0
            for: 1m
            labels:
                severity: critical
            annotations:
                summary: "Container is down"
                description: "Container {{ $labels.instance }} has been down for more than 1 minute"

          # High container CPU usage
          - alert: ContainerHighCpuUsage
            expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "Container high CPU usage"
                description: "Container {{ $labels.name }} CPU usage is above 80%"

          # High container memory usage
          - alert: ContainerHighMemoryUsage
            expr: |
                (
                    container_memory_usage_bytes{name!="", container!="POD", container!=""} 
                    / 
                    container_spec_memory_limit_bytes{name!="", container!="POD", container!=""} 
                ) * 100 > 90
                and 
                container_spec_memory_limit_bytes{name!="", container!="POD", container!=""} > 0
                and 
                container_spec_memory_limit_bytes{name!="", container!="POD", container!=""} < 1e15
            for: 2m
            labels:
                severity: warning
            annotations:
                summary: "Container {{ $labels.name }} high memory usage"
                description: "Container {{ $labels.name }} on {{ $labels.instance }} has been using more than 90% of its memory limit for more than 2 minutes. Current usage: {{ $value | humanizePercentage }}"

          # Alternative: Host memory usage (more reliable)
          - alert: HostHighMemoryUsage
            expr: |
                (
                    (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) 
                    / 
                    node_memory_MemTotal_bytes
                ) * 100 > 80
            for: 5m
            labels:
                severity: warning
            annotations:
                summary: "Host {{ $labels.instance }} high memory usage"
                description: "Host {{ $labels.instance }} memory usage is above 80%. Current usage: {{ $value | humanizePercentage }}"

          # Container memory usage without limits (absolute)
          - alert: ContainerHighMemoryAbsolute
            expr: container_memory_usage_bytes{name!="", container!="POD", container!=""} > 1e9 # 1GB
            for: 5m
            labels:
                severity: info
            annotations:
                summary: "Container {{ $labels.name }} using significant memory"
                description: "Container {{ $labels.name }} is using {{ $value | humanize1024 }}B of memory"

          # CPU usage rule
          - alert: ContainerHighCPUUsage
            expr: |
                rate(container_cpu_usage_seconds_total{name!="", container!="POD", container!=""}[5m]) * 100 > 80
            for: 2m
            labels:
                severity: warning
            annotations:
                summary: "Container {{ $labels.name }} high CPU usage"
                description: "Container {{ $labels.name }} on {{ $labels.instance }} has been using more than 80% CPU for more than 2 minutes. Current usage: {{ $value }}%"

          # PWr Now specific alerts
          - alert: PWrNowBackendDown
            expr: up{job="pwrnow-app"} == 0
            for: 1m
            labels:
                severity: critical
            annotations:
                summary: "PWr Now backend is down"
                description: "PWr Now backend application has been down for more than 1 minute"

          # Database alerts
          - alert: PostgreSQLDown
            expr: up{job="postgresql"} == 0
            for: 1m
            labels:
                severity: critical
            annotations:
                summary: "PostgreSQL is down"
                description: "PostgreSQL database has been down for more than 1 minute"

          # Grafana alerts
          - alert: GrafanaDown
            expr: up{job="grafana"} == 0
            for: 1m
            labels:
                severity: warning
            annotations:
                summary: "Grafana is down"
                description: "Grafana monitoring dashboard has been down for more than 1 minute"
